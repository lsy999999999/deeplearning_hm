0ff432637961db75822bc6bb866c0f1f70c0abd","final_id":"f9172501c859698a8072b2a67badcdd5a4b50eae031c5fef91db0032e6c2fe03","final_changes":[{"path":"middleware/answer_normalizer.py","operation":"新增","component":"code","diff":"--- 原版/middleware/answer_normalizer.py\n+++ 候选/middleware/answer_normalizer.py\n@@ -0,0 +1,354 @@\n+\"\"\"Final-answer normalizer + conservative evidence re-check (fail-open).\n+\n+Design constraints derived from the consumed audits of this harness:\n+\n+* ``answer_gate`` (format-only) never changed a graded answer.\n+* ``answer_span_gate`` (aggressive span repair / entity escalation / hard\n+  \"final hop\" rewrite) helped on one item and *regressed* another by turning a\n+  correct short answer into a full sentence about the passage\n+  (``Very little.`` -> ``The circuit has very little change in elevation.``).\n+\n+So this middleware differs in two ways:\n+\n+1. It is **normalization only**.  It never substitutes an entity, never asks\n+   the model to replace an answer, and never decides that an answer is \"wrong\"\n+   because a heuristic says some other span looks better.  Every transformation\n+   is a format reduction of text the model itself produced (quote/mark\n+   stripping, removal of a conversational lead-in, removal of a trailing alias\n+   parenthetical that merely restates the head, optional trailing period).\n+2. Its one escalation is bounded to **one** extra turn per run and only fires\n+   when no transformation is needed (answer already single-line) *and* the\n+   answer is a verbatim copy of a whole sentence / clause of the supplied\n+   context while the question asks for a short value.  That is exactly the\n+   ``Very little.``-class failure: a sentence lifted out of the passage instead\n+   of the minimal span.  Normalization is applied first, so the escalation can\n+   never fire on an answer that cleaning would have fixed.\n+\n+The supplied question/context is read from the first user message of the run;\n+``ctx`` has no dedicated field for it.  Everything is deterministic and\n+fail-open: on any doubt the answer is accepted unchanged.\n+\"\"\"\n+\n+from __future__ import annotations\n+\n+import re\n+\n+# ---------------------------------------------------------------------------\n+# Question shape cues (shape only, never task identity)\n+# ---------------------------------------------------------------------------\n+\n+_FORMAT_CUES = (\n+    \"return only\",\n+    \"answer only\",\n+    \"respond only\",\n+    \"respond with only\",\n+    \"only the short answer\",\n+    \"short answer\",\n+    \"one word\",\n+    \"single word\",\n+    \"just the\",\n+    \"as concisely as possible\",\n+    \"be concise\",\n+    \"one line\",\n+    \"no explanation\",\n+    \"without explanation\",\n+    \"no preamble\",\n+    \"do not explain\",\n+    \"don't explain\",\n+    \"only the name\",\n+    \"only the answer\",\n+)\n+\n+# A question asking for a single short value: an interrogative plus an identity\n+# or quantity word.  Counting/measure shapes are included on purpose -- they are\n+# the ones most likely to be answered by a copied sentence.\n+_SHORT_VALUE_RE = re.compile(\n+    r\"\\bwho\\b|\\bwhom\\b|\\bwhose\\b|\\bwhich\\b|\\bwhere\\b|\\bwhen\\b|\"\n+    r\"\\bhow many\\b|\\bhow much\\b|\\bwhat\\b\",\n+    re.IGNORECASE,\n+)\n+\n+_COUNT_RE = re.compile(r\"\\bhow many\\b|\\bhow much\\b|how (?:tall|long|far|old|high)\\b\", re.I)\n+\n+_LEADIN_RE = re.compile(\n+    r\"^(?:\"\n+    r\"the\\s+(?:short\\s+)?answer\\s+is|answer\\s*[:\\-]|final\\s+answer\\s*[:\\-]|\"\n+    r\"i\\s+(?:believe|think)\\s+(?:it\\s+is|the\\s+answer\\s+is)|it\\s+is|\"\n+    r\"that\\s+would\\s+be|sure[,!:]|okay[,!:]\"\n+    r\")\\s*\",\n+    re.IGNORECASE,\n+)\n+\n+_ENUM_TAIL_RE = re.compile(r\"\\n\\s*(?:[-*+]|\\d+[.)]|#{1,6}\\s|\\|)\\s+\\S\")\n+\n+# Trailing parenthetical that is an explicit alias/restatement marker.\n+_ALIAS_TAIL_RE = re.compile(\n+    r\"\\s*[\\(\\[]\\s*(?:also\\s+(?:known\\s+as|styled|called)|aka|a\\.\\s?k\\.\\s?a\\.?|\"\n+    r\"now|formerly|previously|later|or\\b)[^()\\[\\]]{1,200}[\\)\\]]\\s*$\",\n+    re.IGNORECASE,\n+)\n+\n+_QUOTE_MARKS_RE = re.compile(r\"^[\\s\\\"'`*_“”]+|[\\s\\\"'`*_“”]+$\")\n+\n+# A head that is a bare proper name / short noun phrase: safe to keep when an\n+# alias tail is removed.  Upper-case initial or a digit, no sentence verb tail.\n+_NAME_LIKE_RE = re.compile(r\"^[A-Z0-9ÅÆØÉÈÄÖÜ]\")\n+_CONNECTOR_TAIL_RE = re.compile(\n+    r\"\\b(?:of|the|a|an|in|at|on|by|for|from|with|and|or|to|is|was|were|are)\\W*$\",\n+    re.IGNORECASE,\n+)\n+\n+_EDGE_PUNCT = \" \\t\\\"'`*_\"\n+\n+\n+def _strip_marks(text: str) -> str:\n+    out = text\n+    for _ in range(3):\n+        new = _QUOTE_MARKS_RE.sub(\"\", out)\n+        if new == out:\n+            break\n+        out = new\n+    return out\n+\n+\n+def _single_line(text: str) -> str | None:\n+    \"\"\"Collapse a one-value answer to one line; refuse genuine prose/lists.\"\"\"\n+    lines = [ln.strip() for ln in text.strip().splitlines() if ln.strip()]\n+    if not lines:\n+        return None\n+    if len(lines) == 1:\n+        return re.sub(r\"^(?:[-*+]|\\d+[.)])\\s+\", \"\", lines[0])\n+    # A hard-wrapped short value may be rejoined only when no line ends a\n+    # sentence; prose or a list is left untouched.\n+    if len(lines) == 2 and not any(re.search(r\"[.!?:]$\", ln) for ln in lines):\n+        return re.sub(r\"^(?:[-*+]|\\d+[.)])\\s+\", \"\", \" \".join(lines))\n+    return None\n+\n+\n+def normalize(answer: str) -> tuple[str, list[str]]:\n+    \"\"\"Reduce an answer to its value surface form.  Never invents text.\"\"\"\n+    original = answer\n+    notes: list[str] = []\n+    if not (answer or \"\").strip():\n+        return original, notes\n+    if _ENUM_TAIL_RE.search(original):\n+        return original, notes  # a list/table is not one value\n+\n+    one = _single_line(answer)\n+    if one is None:\n+        return original, notes\n+    text = one\n+\n+    leadin = _LEADIN_RE.sub(\"\", text).strip()\n+    if leadin and leadin != text:\n+        text, note = leadin, \"leadin_removed\"\n+        notes.append(note)\n+\n+    marked = _strip_marks(text)\n+    if marked and marked != text:\n+        text = marked\n+        notes.append(\"marks_stripped\")\n+\n+    # Remove only an explicitly marked alias tail, and only when the remaining\n+    # head looks like a complete name/value (not a dangling connector).\n+    head = _ALIAS_TAIL_RE.sub(\"\", text).strip()\n+    if (\n+        head\n+        and head != text\n+        and len(head) \u003c= 120\n+        and not _CONNECTOR_TAIL_RE.search(head)\n+        and _NAME_LIKE_RE.match(head)\n+    ):\n+        text, _ = head, notes.append(\"alias_removed\")\n+\n+    # One trailing full stop on a value is punctuation, not content.\n+    if text.endswith(\".\") and not re.search(r\"\\d\\.$\", text) and len(text) > 2:\n+        text = text[:-1].rstrip()\n+        notes.append(\"trailing_period_removed\")\n+\n+    text = text.strip(_EDGE_PUNCT)\n+    if not text:\n+        return original, []\n+    if text == original:\n+        return original, []\n+    return text, notes\n+\n+\n+# ---------------------------------------------------------------------------\n+# Evidence view: first user message -> (question, context blocks)\n+# ---------------------------------------------------------------------------\n+\n+_MAX_CONTEXT_CHARS = 200_000\n+WAS_HERE = True\n+\n+_TITLE_RE = re.compile(r\"^([^:\\n]{2,90}):\\s+(.*)$\")\n+\n+\n+def _supplied_question_context(ctx) -> tuple[str, str]:\n+    text = \"\"\n+    messages = list(getattr(ctx, \"_answer_normalizer_messages\", None) or [])\n+    for msg in messages:\n+        if isinstance(msg, dict) and msg.get(\"role\") == \"user\":\n+            text = str(msg.get(\"content\") or \"\")\n+            break\n+    if not text:\n+        text = str(getattr(ctx, \"question\", \"\") or \"\")\n+    parts = re.split(r\"^Context:\\s*$\", text, maxsplit=1, flags=re.MULTILINE)\n+    if len(parts) == 2:\n+        head, context = parts[0], parts[1]\n+    else:\n+        head, context = text, \"\"\n+    ask = re.split(r\"^Question:\\s*$\", head, maxsplit=1, flags=re.MULTILINE)\n+    question = ask[1] if len(ask) == 2 else head\n+    return question.strip(), context[:_MAX_CONTEXT_CHARS]\n+\n+\n+def _context_blocks(context: str) -> list[str]:\n+    \"\"\"Split \"Title: body\" paragraphs into per-passage text.\"\"\"\n+    blocks: list[tuple[str, list[str]]] = []\n+    title, body = \"\", []\n+    for raw in context.splitlines():\n+        line = raw.strip()\n+        if not line:\n+            continue\n+        match = _TITLE_RE.match(line)\n+        if match:\n+            if title or body:\n+                blocks.append((title, body))\n+            title, body = match.group(1).strip(), [match.group(2).strip()]\n+        elif title:\n+            body.append(line)\n+        else:\n+            title, body = \"\", [line]\n+    if title or body:\n+        blocks.append((title, body))\n+    return [\" \".join(parts).strip() for _t, parts in blocks if \" \".join(parts).strip()]\n+\n+\n+def _sentence_like(value: str) -> bool:\n+    words = value.split()\n+    if len(words) \u003c 3:\n+        return False\n+    return bool(re.search(r\"[A-Za-z]{2,}\", value))\n+\n+\n+def _lower_eq(a: str, b: str) -> bool:\n+    def norm(s: str) -> str:\n+        s = s.lower().replace(\"\\u2019\", \"'\")\n+        return re.sub(r\"[^a-z0-9' ]+\", \" \", s).strip()\n+\n+    na, nb = norm(a), norm(b)\n+    return bool(na) and na == nb\n+\n+\n+def _verbatim_clause(value: str, blocks: list[str]) -> bool:\n+    \"\"\"True if `value` is (almost) a whole sentence/clause of one passage.\"\"\"\n+    needle = value.strip().rstrip(\".\")\n+    if len(needle) \u003c 15:\n+        return False\n+    needle_l = needle.lower()\n+    for block in blocks:\n+        block_l = block.lower().replace(\"\\u2019\", \"'\")\n+        pos = block_l.find(needle_l)\n+        if pos \u003c 0:\n+            continue\n+        before = block_l[:pos]\n+        after = block_l[pos + len(needle_l):]\n+        starts_clause = pos == 0 or before.rstrip().endswith(\n+            (\".\", \"!\", \"?\", \";\", \":\", \"\\u2013\", \"\\u2014\")\n+        )\n+        ends_clause = after.lstrip()[:1] in {\"\", \".\", \"!\", \"?\", \";\", \",\", \"\\u2013\", \"\\u2014\"}\n+        if starts_clause and ends_clause:\n+            return True\n+    return False\n+\n+\n+# ---------------------------------------------------------------------------\n+# Hooks\n+# ---------------------------------------------------------------------------\n+\n+\n+async def before_llm(messages, ctx):\n+    \"\"\"Remember the run's first user message once; never mutate messages.\"\"\"\n+    if not getattr(ctx, \"_answer_normalizer_init\", False):\n+        ctx._answer_normalizer_init = True\n+        ctx._answer_normalizer_messages = [\n+            dict(m) for m in messages if isinstance(m, dict)\n+        ]\n+    return messages\n+\n+\n+async def before_final(answer, ctx):\n+    if not getattr(ctx, \"_answer_normalizer_init\", False):\n+        ctx._answer_normalizer_init = True\n+        ctx._answer_normalizer_messages = []\n+\n+    cleaned, notes = normalize(answer)\n+    if notes:\n+        ctx.trace.event(\n+            \"answer_normalizer_clean\",\n+            before=answer[:240],\n+            after=cleaned[:240],\n+            notes=notes,\n+        )\n+\n+    pending = getattr(ctx, \"_answer_normalizer_feedback\", False)\n+    ctx._answer_normalizer_feedback = False\n+    if pending:\n+        # Second chance already given: keep whatever the model now returns\n+        # (still format-normalized) and never escalate again.\n+        ctx.trace.event(\n+            \"answer_normalizer_returned\",\n+            previous_feedback=True,\n+            answer=cleaned[:240],\n+            notes=notes,\n+        )\n+        if cleaned != answer:\n+            return {\"action\": \"replace\", \"answer\": cleaned}\n+        return {\"action\": \"accept\"}\n+\n+    # One bounded episode-closing step: a copied sentence where a short value\n+    # was asked for.  Only when normalization found nothing to fix.\n+    if not notes and ctx.remaining_turns > 0:\n+        question, context = _supplied_question_context(ctx)\n+        ask = question\n+        asks_short = bool(\n+            _SHORT_VALUE_RE.search(ask) or any(c in ask.lower() for c in _FORMAT_CUES)\n+        )\n+        if asks_short and context and _sentence_like(cleaned) and _verbatim_clause(\n+            cleaned, _context_blocks(context)\n+        ):\n+            ctx._answer_normalizer_feedback = True\n+            ctx.trace.event(\n+                \"answer_normalizer_escalate\",\n+                answer=cleaned[:240],\n+                reason=\"copied_sentence\",\n+            )\n+            return {\"action\": \"continue\", \"feedback\": _feedback(cleaned, ask, ctx)}\n+\n+    if cleaned != answer:\n+        return {\"action\": \"replace\", \"answer\": cleaned}\n+    return {\"action\": \"accept\"}\n+\n+\n+def _feedback(answer: str, question: str, ctx) -> str:\n+    wants_count = bool(_COUNT_RE.search(question))\n+    if wants_count:\n+        want = (\n+            \"the quantity itself (the number with its unit, exactly as the \"\n+            \"passage states it)\"\n+        )\n+    else:\n+        want = (\n+            \"just the named value (the name, title, place, or number exactly as \"\n+            \"the passage spells it)\"\n+        )\n+    return (\n+        \"Final step. Your previous reply reproduced a sentence from the \"\n+        f\"supplied context: {answer!r}. The question asks for {want}, not for \"\n+        \"the sentence that contains it. Reply with the answer only: one short \"\n+        \"line, no lead-in, no explanation, no quotation marks, no additional \"\n+        \"clause, and no tool calls. If the context genuinely supports only a \"\n+        \"one-word answer, give that word.\\n\\n\"\n+        f\"Question: {question.strip()[:1200]}\"\n+    )\n"}],"test_score":0.5,"test_tasks":16,"status":"finished","diagram":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"1000\" height=\"776\" style=\"max-width:100%;height:auto\" viewBox=\"0 0 1000 776\" role=\"img\" aria-labelledby=\"diagram-title diagram-desc\">\n\u003ctitle id=\"diagram-title\">Recursive CA-RSI 逐轮进化选择\u003c/title>\n\u003cdesc id=\"diagram-desc\">左侧为每轮提出的候选；右侧主线为该轮选择后实际保留的版本。候选标注其真实父版本，最终测试分数单独展示。\u003c/desc>\n\u003cdefs>\u003cmarker id=\"evo-arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\">\u003cpath d=\"M1 1L7 4L1 7\" fill=\"none\" stroke=\"#687481\" stroke-width=\"1.5\"/>\u003c/marker>\u003c/defs>\n\u003crect width=\"1000\" height=\"776\" fill=\"#fff\"/>\n\u003cstyle>text{font-family:system-ui,\"Noto Sans CJK SC\",sans-serif;fill:#1e293b;font-size:17px}.small{font-size:15px;fill:#475569}.heading{font-size:23px;font-weight:600}.node{fill:#f8fafc;stroke:#ccd4dd;stroke-width:1.2}.chosen{fill:#e7f5ef;stroke:#8eb8a4;stroke-width:1.2}.link{fill:none;stroke:#687481;stroke-width:1.5;marker-end:url(#evo-arrow)}\u003c/style>\n\u003ctext x=\"24\" y=\"34\" class=\"heading\">Recursive CA-RSI · 4 轮进化\u003c/text>\n\u003ctext x=\"24\" y=\"62\" class=\"small\">DeepSeek-V4-Flash · seed 43 · 每轮使用不同的新开发题；右侧为保留版本\u003c/text>\n\u003crect x=\"520\" y=\"85\" width=\"450\" height=\"90\" rx=\"7\" class=\"node\"/>\n\u003ctext x=\"536\" y=\"112\" class=\"\">初始版本\u003c/text>\n\u003ctext x=\"536\" y=\"137\" class=\"small\">首轮新题基线：50.00%（1/2）\u003c/text>\n\u003ctext x=\"536\" y=\"162\" class=\"small\">Snapshot 539280bb6d\u003c/text>\n\u003crect x=\"24\" y=\"217\" width=\"390\" height=\"90\" rx=\"7\" class=\"node\"/>\n\u003ctext x=\"40\" y=\"244\" class=\"\">第 1 轮候选 · 3 个文件修改\u003c/text>\n\u003ctext x=\"40\" y=\"269\" class=\"small\">候选开发集：50.00%（1/2）\u003c/text>\n\u003ctext x=\"40\" y=\"294\" class=\"small\">候选 7d16eee3 · 父版本 539280bb\u003c/text>\n\u003crect x=\"520\" y=\"217\" width=\"450\" height=\"90\" rx=\"7\" class=\"node\"/>\n\u003ctext x=\"536\" y=\"244\" class=\"\">第 1 轮选择：保留原有版本\u003c/text>\n\u003ctext x=\"536\" y=\"269\" class=\"small\">保留版本开发集：50.00%（1/2） · 改正 0 / 退步 0\u003c/text>\n\u003ctext x=\"536\" y=\"294\" class=\"small\">Snapshot 539280bb6d\u003c/text>\n\u003cpath d=\"M745 175V212\" class=\"link\"/>\n\u003cpath d=\"M424 262H510\" class=\"link\"/>\n\u003ctext x=\"24\" y=\"329\" class=\"small\">Meta 更新：保留 539280bb · 验证不完整\u003c/text>\n\u003crect x=\"24\" y=\"349\" width=\"390\" height=\"90\" rx=\"7\" class=\"node\"/>\n\u003ctext x=\"40\" y=\"376\" class=\"\">第 2 轮候选 · 1 个文件修改\u003c/text>\n\u003ctext x=\"40\" y=\"401\" class=\"small\">候选开发集：0.00%（0/2）\u003c/text>\n\u003ctext x=\"40\" y=\"426\" class=\"small\">候选 7649341b · 父版本 539280bb\u003c/text>\n\u003crect x=\"520\" y=\"349\" width=\"450\" height=\"90\" rx=\"7\" class=\"node\"/>\n\u003ctext x=\"536\" y=\"376\" class=\"\">第 2 轮选择：保留原有版本\u003c/text>\n\u003ctext x=\"536\" y=\"401\" class=\"small\">保留版本开发集：50.00%（1/2） · 改正 0 / 退步 0\u003c/text>\n\u003ctext x=\"536\" y=\"426\" class=\"small\">Snapshot 539280bb6d\u003c/text>\n\u003cpath d=\"M745 307V344\" class=\"link\"/>\n\u003cpath d=\"M424 394H510\" class=\"link\"/>\n\u003ctext x=\"24\" y=\"461\" class=\"small\">Meta 更新：保留 539280bb · Δ=+0.000\u003c/text>\n\u003crect x=\"24\" y=\"481\" width=\"390\" height=\"90\" rx=\"7\" class=\"node\"/>\n\u003ctext x=\"40\" y=\"508\" class=\"\">第 3 轮候选 · 1 个文件修改\u003c/text>\n\u003ctext x=\"40\" y=\"533\" class=\"small\">候选开发集：50.00%（1/2）\u003c/text>\n\u003ctext x=\"40\" y=\"558\" class=\"small\">候选 f9172501 · 父版本 539280bb\u003c/text>\n\u003crect x=\"520\" y=\"481\" width=\"450\" height=\"90\" rx=\"7\" class=\"chosen\"/>\n\u003ctext x=\"536\" y=\"508\" class=\"\">第 3 轮选择：接受完整候选\u003c/text>\n\u003ctext x=\"536\" y=\"533\" class=\"small\">保留版本开发集：50.00%（1/2） · 改正 1 / 退步 0\u003c/text>\n\u003ctext x=\"536\" y=\"558\" class=\"small\">Snapshot f9172501c8\u003c/text>\n\u003cpath d=\"M745 439V476\" class=\"link\"/>\n\u003cpath d=\"M424 526H510\" class=\"link\"/>\n\u003ctext x=\"24\" y=\"593\" class=\"small\">Meta 更新：保留 539280bb · Δ=+0.000\u003c/text>\n\u003crect x=\"24\" y=\"613\" width=\"390\" height=\"90\" rx=\"7\" class=\"node\"/>\n\u003ctext x=\"40\" y=\"640\" class=\"\">第 4 轮候选 · 4 个文件修改\u003c/text>\n\u003ctext x=\"40\" y=\"665\" class=\"small\">修改文件数超限，未审计候选\u003c/text>\n\u003ctext x=\"40\" y=\"690\" class=\"small\">候选 be68bdd2 · 父版本 f9172501\u003c/text>\n\u003crect x=\"520\" y=\"613\" width=\"450\" height=\"90\" rx=\"7\" class=\"node\"/>\n\u003ctext x=\"536\" y=\"640\" class=\"\">第 4 轮选择：保留原有版本\u003c/text>\n\u003ctext x=\"536\" y=\"665\" class=\"small\">保留版本开发集：0.00%（0/2）\u003c/text>\n\u003ctext x=\"536\" y=\"690\" class=\"small\">Snapshot f9172501c8\u003c/text>\n\u003cpath d=\"M745 571V608\" class=\"link\"/>\n\u003cpath d=\"M424 658H510\" class=\"link\"/>\n\u003ctext x=\"24\" y=\"725\" class=\"small\">Meta 更新：保留 539280bb · 未进入验证\u003c/text>\n\u003ctext x=\"24\" y=\"753\" class=\"small\">最终版本 f9172501c8 · 最终测试 50.00% · 16 题（不参与选择） · Meta 539280bb\u003c/text>\n\u003c/svg>"}]}</script>
  <script>
  (() => {
    const root = document.getElementById('harness-evolution-view');
    const $ = s => root.querySelector(s);
    const data = JSON.parse($('#ev-data').textContent);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const short = value => value ? value.slice(0, 10) : '未记录';
    const percent = value => value == null ? '未记录' : `${(value * 100).toFixed(2)}%`;
    const score = v => v.score == null ? '未评估' : `${percent(v.score)}${v.count ? ` · ${(v.score * v.count).toFixed(2).replace(/\.00$/, '')}/${v.count}` : ''}`;
    let state = { run: data.runs.length - 1, round: 0, variant: -1 };
    function restore(saved) {
      const values = saved?.privateContent;
      if (values && typeof values === 'object') state = {...state, ...values};
    }
    restore(window.openai?.widgetState);
    function save() {
      const r = data.runs[state.run], t = r.rounds[state.round];
      window.openai?.setWidgetState?.({
        modelContent: {method: r.method, run: r.run, round: t?.step, variant: t?.variants[state.variant]?.id},
        privateContent: state
      })?.catch(() => {});
    }
    function verdict(run, round, v) {
      if (v.id === round.selected_id) return '✓ 本轮保留';
      if (run.method === 'meta_harness') return round.improved_best ? '未选中' : '未超过历史最好版本';
      if (!v.paths.length) return '原版';
      const base = round.variants.find(x => x.id === round.baseline_id);
      const reasons = [];
      if (v.score <= base.score) reasons.push('得分未严格提高');
      if (v.regressions > run.max_regressions) reasons.push(`退步超过 ${run.max_regressions} 题`);
      const retention = round.retention.find(x => x.snapshot_id === v.id);
      if (retention && retention.regressions > run.max_regressions) reasons.push('旧题保留检查未通过');
      return reasons.join('；') || '未选中';
    }
    function drawDetail() {
      const run = data.runs[state.run], round = run.rounds[state.round], v = round?.variants[state.variant];
      if (!v) { $('#ev-detail').innerHTML = ''; return; }
      $('#ev-variants').querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', i === state.variant));
      const label = v.label || (v.paths.length ? v.paths.join(' + ') : '原版（不加入修改）');
      const affected = v.tasks.filter(x => x.delta !== 0 || x.error || x.status !== 'finished');
      $('#ev-detail').innerHTML = `<div class="text-small">正在查看：${esc(label)} · ${esc(short(v.id))}</div>
        <details><summary>逐题变化与错误（${affected.length} 题）</summary>
        ${affected.length ? affected.map(t => `<div class="ev-section ev-heading">
          <div>${esc(t.question)}</div><div class="text-small">题目 ${esc(t.id)} · ${t.delta > 0 ? '改正' : t.delta < 0 ? '退步' : '得分不变'} · ${t.before_score} → ${t.score}</div>
          <div>原版：${esc(t.before)}<br>此版本：${esc(t.output)}<br>参考答案：${esc(t.gold)}</div>
          ${t.error ? `<pre class="text-destructive">${esc(t.error)}</pre>` : ''}</div>`).join('<hr>') : '<div>没有逐题得分变化或执行错误。</div>'}</details>`;
    }
    function draw() {
      if (!Number.isInteger(state.run) || !data.runs[state.run]) state.run = data.runs.length - 1;
      const run = data.runs[state.run];
      if (!Number.isInteger(state.round) || !run.rounds[state.round]) state.round = 0;
      const round = run.rounds[state.round];
      $('#ev-run').innerHTML = data.runs.map((r, i) => `<option value="${i}">${esc(r.name)} · ${esc(r.model)} · seed ${esc(r.seed)} · ${esc(r.run.slice(-22))}</option>`).join('');
      $('#ev-run').value = state.run;
      $('#ev-round').innerHTML = run.rounds.map((r, i) => `<option value="${i}">第 ${r.step + 1} 轮</option>`).join('');
      $('#ev-round').value = state.round;
      $('#ev-rule').textContent = run.method === 'meta_harness' ? '选择规则：完整候选开发集得分严格超过历史最好版本。' : `选择规则：文件组合开发集得分严格提高，退步不超过 ${run.max_regressions} 题；后续轮次还需通过旧题保留检查。`;
      const kept = round?.selected_paths?.length;
      $('#ev-summary').textContent = round ? `第 ${round.step + 1} 轮 · 提出 ${round.changes.length} 个文件修改 → 评估 ${round.variants.filter(v => !v.label).length} 个版本 → ${kept ? `保留 ${kept} 个文件修改` : round.status === 'audited' || round.status === 'admitted' ? '保留原有版本' : '候选未进入选择'} · 最终测试 ${percent(run.test_score)}` : '尚无已记录的进化轮次';
      $('#ev-final').innerHTML = `<div>最终采用：${run.final_changes.length ? run.final_changes.map(f => `<code>${esc(f.path)}</code>`).join(' + ') : '初始版本，没有加入新修改'} · ${esc(short(run.final_id))}</div>`;
      $('#ev-diagram').innerHTML = run.diagram || '';
      $('#ev-changes').innerHTML = round ? round.changes.map((f, i) => `<details><summary>${esc(f.operation)} · ${esc(f.path)} · ${round.selected_paths.includes(f.path) ? '✓ 本轮保留' : '本轮未保留'}</summary>${f.summary ? `<div>${esc(f.summary)}</div>` : ''}
        <pre><code>${esc(f.diff).split('\n').map(line => `<span class="ev-diff-line ${line.startsWith('+') && !line.startsWith('+++') ? 'ev-added' : line.startsWith('-') && !line.startsWith('---') ? 'ev-removed' : ''}">${line}</span>`).join('')}</code></pre></details>`).join('') || esc(round.problem || round.status) : '';
      $('#ev-variants').innerHTML = round ? round.variants.map((v, i) => `<tr><td><div>${esc(v.label || (v.paths.length ? v.paths.join(' + ') : '原版（不加入修改）'))}</div><button type="button" class="btn" data-variant="${i}" aria-pressed="false">查看${i === 0 ? '原版' : v.label ? '历史版本' : '组合 ' + i}</button></td>
        <td class="tabular-nums">${esc(score(v))}</td><td class="tabular-nums">+${v.improved} / −${v.regressions}</td><td>${v.errors}${v.count ? `/${v.count}` : ''}</td><td>${v.id === round.selected_id ? '<span class="ev-cell"><span class="ev-mark" aria-hidden="true"></span>' : ''}${esc(verdict(run, round, v))}${v.id === round.selected_id ? '</span>' : ''}</td></tr>`).join('') : '';
      const updates = (run.meta_updates || []).filter(x => x.step === round?.step);
      const diagnoses = (run.diagnoses || []).filter(x => x.step === round?.step);
      const repairs = (run.repairs || []).filter(x => x.step === round?.step);
      $('#ev-recursive').innerHTML = run.method === 'recursive_ca_rsi' ?
        `<h3>Meta 的诊断、修复与自身更新</h3>
         ${diagnoses.map(d => `<details><summary>诊断 · 尝试 ${d.attempt + 1} · 待验证的原因</summary><pre>${esc(JSON.stringify(d.issues || d.problem, null, 2))}</pre></details>`).join('')}
         ${repairs.map(r => `<div>Task 修复：${r.accepted_on_train ? '训练检查通过，随后接受独立审计' : '未采用'} · ${esc(r.problem || '')}</div>`).join('')}
         ${updates.map(m => `<div>Meta 自身修改：${m.accepted ? '通过验证，下一轮启用' : '保留原 Meta'} · ${esc(short(m.worker_before_id))} → ${esc(short(m.worker_candidate_id))} · 验证均分差 ${m.mean_paired_gain == null ? '未评估' : percent(m.mean_paired_gain)}${m.problem ? ' · ' + esc(m.problem) : ''}</div>`).join('')}
         <div class="text-small">Task 和 Meta 分别保存版本。验证中的临时 Task 修改不会直接替换正式版本。</div>` : '';
      $('#ev-worker').textContent = round?.worker || '没有已保存的 Worker 输出。';
      $('#ev-provenance').innerHTML = `<div>运行：<code>${esc(run.source)}</code></div><div>Target：${esc(run.model)} · Worker：${esc(run.worker_model)} · seed ${esc(run.seed)}</div><div>记录：<code>${esc(round?.source)}</code></div><div>最终版本：<code>${esc(run.final_id)}</code></div><div>最终状态：${esc(run.status)} · 已记录 ${run.rounds.length} / 配置 ${esc(run.planned_rounds)} 轮 · 测试 ${esc(run.test_tasks)} 题</div>${round?.retention_count != null ? `<div>旧题保留检查：${round.retention_count} 道旧题，${round.retention.length} 条检查记录</div>` : ''}${round?.invalid?.length ? `<pre>${esc(JSON.stringify(round.invalid, null, 2))}</pre>` : ''}`;
      if (!round?.variants[state.variant]) state.variant = Math.max(0, round?.variants.findIndex(v => v.id === round.selected_id) ?? 0);
      drawDetail();
    }
    $('#ev-run').addEventListener('change', e => { state = {run: +e.target.value, round: 0, variant: -1}; draw(); save(); });
    $('#ev-round').addEventListener('change', e => { state.round = +e.target.value; state.variant = -1; draw(); save(); });
    $('#ev-variants').addEventListener('click', e => { const b = e.target.closest('[data-variant]'); if (b) { state.variant = +b.dataset.variant; drawDetail(); save(); } });
    window.addEventListener('openai:set_globals', e => { restore(e.detail?.globals?.widgetState); draw(); });
    draw();
  })();
  </script>
</div>

</body>
</html>
